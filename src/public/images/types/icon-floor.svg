  <rect x="30" y="46" width="40" height="3" rx="1" fill="#3B7DD8" opacity="0.5"/>
  <rect x="30" y="54" width="40" height="3" rx="1" fill="#3B7DD8" opacity="0.5"/>
  <rect x="30" y="62" width="40" height="3" rx="1" fill="#3B7DD8" opacity="0.5"/>
  <!-- bottom intake -->
