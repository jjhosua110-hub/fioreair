<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#f0f2f5"/>
  <!-- wall mount bracket -->
  <rect x="70" y="55" width="10" height="40" rx="3" fill="#888"/>
  <rect x="220" y="55" width="10" height="40" rx="3" fill="#888"/>
  <!-- indoor unit -->
  <rect x="50" y="30" width="200" height="85" rx="10" fill="#214E8F"/>
  <rect x="55" y="35" width="190" height="25" rx="4" fill="#3B7DD8" opacity="0.5"/>
  <!-- display panel -->
  <rect x="110" y="38" width="80" height="8" rx="4" fill="#1D8CD6" opacity="0.8"/>
  <!-- vent slots -->
  <rect x="60" y="80" width="180" height="5" rx="2" fill="#3B7DD8" opacity="0.4"/>
  <rect x="60" y="90" width="180" height="5" rx="2" fill="#3B7DD8" opacity="0.4"/>
  <rect x="60" y="100" width="180" height="5" rx="2" fill="#3B7DD8" opacity="0.4"/>
  <!-- outdoor unit -->
  <rect x="90" y="160" width="120" height="90" rx="6" fill="#555"/>
  <rect x="100" y="170" width="35" height="30" rx="3" fill="#777"/>
  <rect x="142" y="170" width="35" height="30" rx="3" fill="#777"/>
  <rect x="184" y="170" width="18" height="30" rx="3" fill="#777"/>
  <rect x="100" y="208" width="100" height="25" rx="3" fill="#666"/>
  <!-- pipes -->
  <line x1="140" y1="115" x2="140" y2="160" stroke="#999" stroke-width="3"/>
  <line x1="120" y1="115" x2="120" y2="160" stroke="#999" stroke-width="2"/>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Split-Type Aircon</text>
</svg>