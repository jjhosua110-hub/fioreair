<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#f0f2f5"/>
  <!-- window frame -->
  <rect x="30" y="20" width="240" height="240" rx="8" fill="#DDD" stroke="#BBB" stroke-width="3"/>
  <!-- AC unit -->
  <rect x="50" y="50" width="200" height="110" rx="8" fill="#214E8F"/>
  <rect x="55" y="55" width="190" height="20" rx="4" fill="#3B7DD8" opacity="0.5"/>
  <!-- control panel -->
  <rect x="120" y="58" width="60" height="8" rx="3" fill="#1D8CD6" opacity="0.7"/>
  <!-- vent slots -->
  <rect x="60" y="100" width="180" height="4" rx="2" fill="#3B7DD8" opacity="0.4"/>
  <rect x="60" y="108" width="180" height="4" rx="2" fill="#3B7DD8" opacity="0.4"/>
  <rect x="60" y="116" width="180" height="4" rx="2" fill="#3B7DD8" opacity="0.4"/>
  <rect x="60" y="124" width="180" height="4" rx="2" fill="#3B7DD8" opacity="0.4"/>
  <rect x="60" y="132" width="180" height="4" rx="2" fill="#3B7DD8" opacity="0.4"/>
  <!-- cold air arrows -->
  <path d="M50 185 l10 -15 M90 190 l5 -18 M130 192 l0 -20 M170 192 l-5 -20 M210 190 l-10 -18 M250 185 l-15 -15" stroke="#1D8CD6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Window-Type Aircon</text>
</svg>